services:
  database:
    build: ./database
    environment:
      POSTGRES_DB: discord_bot
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot -d discord_bot"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  storage:
    build: ./storage
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:8333:8333"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: >-
        postgres://discord_bot:${POSTGRES_PASSWORD}@database:5432/discord_bot
      SEAWEEDFS_ENDPOINT: http://storage:8333
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        cd database && bun run generate && bun run migrate &&
        cd .. && bun run bot/src/index.ts
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
